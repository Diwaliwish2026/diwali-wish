<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diwali Surprise 🪔</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#5b1600,#18001f 65%);
color:#fff;
min-height:100vh;
overflow:hidden;
text-align:center;
}

.screen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.card{
width:100%;
max-width:430px;
padding:35px 22px;
border-radius:25px;
background:rgba(255,255,255,.10);
border:1px solid rgba(255,215,0,.35);
box-shadow:0 0 40px rgba(255,180,0,.25);
}

.gift{
font-size:90px;
animation:bounce 1.3s infinite;
}

h1{
font-size:30px;
margin:15px 0;
}

p{
font-size:18px;
line-height:1.6;
}

button{
border:0;
padding:16px 30px;
border-radius:40px;
background:#ffd700;
color:#5a1700;
font-size:18px;
font-weight:bold;
box-shadow:0 0 25px rgba(255,215,0,.8);
}

#surprise{
display:none;
}

.diya{
font-size:90px;
animation:glow 1s infinite alternate;
}

.wish{
font-size:31px;
font-weight:bold;
color:#ffd700;
}

.name{
font-size:25px;
margin:15px 0;
}

.fire{
position:fixed;
font-size:28px;
pointer-events:none;
animation:fall 3s linear forwards;
}

@keyframes bounce{
50%{transform:translateY(-15px)}
}

@keyframes glow{
from{filter:drop-shadow(0 0 5px orange)}
to{filter:drop-shadow(0 0 35px yellow)}
}

@keyframes fall{
from{
transform:translateY(-80px) scale(.5);
opacity:1;
}
to{
transform:translateY(105vh) scale(1.3);
opacity:0;
}
}
</style>
</head>

<body>

<div class="screen" id="start">
<div class="card">

<div class="gift">🎁</div>

<h1>Aapke Liye Ek Surprise Hai ❤️</h1>

<p>
Diwali par aapke liye<br>
ek chhota sa surprise hai...
</p>

<button onclick="openSurprise()">
OPEN SURPRISE 🪔
</button>

</div>
</div>


<div class="screen" id="surprise">
<div class="card">

<div class="diya">🪔</div>

<div class="wish">
✨ HAPPY DIWALI ✨
</div>

<div class="name" id="personName"></div>

<p>
Aapki zindagi khushiyon,<br>
roshni aur tarakki se bhar jaye ❤️
</p>

<p>
🪔 Shubh Deepawali 🪔
</p>

<button onclick="shareWish()">
📲 WhatsApp par Share
</button>

</div>
</div>


<script>

const params = new URLSearchParams(window.location.search);

let name = params.get("name");

if(!name){
name = "Aap";
}

document.getElementById("personName").innerHTML =
"❤️ " + decodeURIComponent(name) + " ❤️";


function openSurprise(){

document.getElementById("start").style.display="none";

document.getElementById("surprise").style.display="flex";

for(let i=0;i<45;i++){

let fire=document.createElement("div");

fire.className="fire";

fire.innerHTML=["🎆","✨","⭐","💥","🪔"]
[Math.floor(Math.random()*5)];

fire.style.left=Math.random()*100+"%";

fire.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(fire");

}

}


function shareWish(){

let url=window.location.href;

let text="🎁 Aapke liye ek Diwali Surprise hai 🪔✨%0A%0A"+url;

window.open(
"https://wa.me/?text="+text,
"_blank"
);

}

</script>

</body>
</html>
document.body.appendChild(fire");
